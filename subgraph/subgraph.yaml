specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: sVusdStakingVault
    network: mainnet
    source:
      address: "0x476310E34D2810f7d79C43A74E4D79405bd7a925" # sVUSD
      abi: StakingVault
      startBlock: 24625396
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ExitTicket
        - ExitTicketQueueSummary
        - UserStakingPosition
        - VaultAprHistory
        - VaultConfig
        - VaultHistory
      abis:
        - name: StakingVault
          file: ./abis/StakingVault.json
        - name: YieldDistributor
          file: ./abis/YieldDistributor.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: WithdrawCancelled(indexed address,indexed uint256,uint256,uint256)
          handler: handleWithdrawCancelled
        - event: WithdrawClaimed(indexed address,indexed address,indexed uint256,uint256)
          handler: handleWithdrawClaimed
        - event: WithdrawRequested(indexed address,indexed uint256,uint256,uint256,uint256)
          handler: handleWithdrawRequested
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: polling
            every: 300 # blocks in 1h
      file: ./src/earn.ts
  - kind: ethereum
    name: sVetBTCStakingVault
    network: mainnet
    source:
      address: "0x0cB9D84d4bcEc8d3D5B2d99a6F07f4605325987e" # svetBTC
      abi: StakingVault
      startBlock: 24931128
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ExitTicket
        - ExitTicketQueueSummary
        - UserStakingPosition
        - VaultAprHistory
        - VaultConfig
        - VaultHistory
      abis:
        - name: StakingVault
          file: ./abis/StakingVault.json
        - name: YieldDistributor
          file: ./abis/YieldDistributor.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: WithdrawCancelled(indexed address,indexed uint256,uint256,uint256)
          handler: handleWithdrawCancelled
        - event: WithdrawClaimed(indexed address,indexed address,indexed uint256,uint256)
          handler: handleWithdrawClaimed
        - event: WithdrawRequested(indexed address,indexed uint256,uint256,uint256,uint256)
          handler: handleWithdrawRequested
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: polling
            every: 300 # blocks in 1h
      file: ./src/earn.ts
  - kind: ethereum
    name: vusdGateway
    network: mainnet
    source:
      address: "0xDaD503f8B9d42bb7af3AfC588358D30163e4416F" # VUSD gateway
      abi: Gateway
      startBlock: 24625393
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TvlHistory
        - TvlTokenHistory
      abis:
        - name: Gateway
          file: ./abis/Gateway.json
        - name: PeggedToken
          file: ./abis/PeggedToken.json
        - name: Treasury
          file: ./abis/Treasury.json
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: polling
            every: 300 # blocks in 1h
      file: ./src/tvl.ts
  - kind: ethereum
    name: vetBTCGateway
    network: mainnet
    source:
      address: "0xCBA2Ffa0AC52d7871a4221a871793Eb788013faB" # vetBTC gateway
      abi: Gateway
      startBlock: 24931126
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TvlHistory
        - TvlTokenHistory
      abis:
        - name: Gateway
          file: ./abis/Gateway.json
        - name: PeggedToken
          file: ./abis/PeggedToken.json
        - name: Treasury
          file: ./abis/Treasury.json
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: polling
            every: 300 # blocks in 1h
      file: ./src/tvl.ts
